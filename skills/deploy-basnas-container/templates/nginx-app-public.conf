# /volume1/docker/nginx/conf.d/<application>.conf
# Public zone: https://<application>.office.c2h.nl/ (public DNS — existing setup)

upstream <application>_backend {
    server <application>:<container_port>;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name <application>.office.c2h.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <application>.office.c2h.nl;

    ssl_certificate     /volume1/docker/nginx/ssl/office.c2h.nl/fullchain.pem;
    ssl_certificate_key /volume1/docker/nginx/ssl/office.c2h.nl/privkey.pem;

    # include /volume1/docker/nginx/snippets/public-exposure-<application>.conf;

    location / {
        proxy_pass http://<application>_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
