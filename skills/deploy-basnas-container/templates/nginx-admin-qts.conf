# /etc/nginx/conf.d/admin-qts.conf
# https://admin.basnas/ → QNAP QTS (host gateway, not a Docker app name)

# QTS HTTPS on LAN IP (not :8080 — jobhunter; not docker bridge — unreachable on QNAP)
upstream qts_backend {
    server 192.168.2.2:8443;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.basnas;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.basnas;

    ssl_certificate     /etc/nginx/certs/basnas/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/basnas/privkey.pem;

    client_max_body_size 0;

    location / {
        proxy_pass https://qts_backend;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host 192.168.2.2;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
