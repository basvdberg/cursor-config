# /etc/nginx/conf.d/<application>.conf
# Internal zone: https://<application>.basnas/ (LAN DNS only — not on public DNS)

upstream <application>_backend {
    server <application>:<container_port>;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name <application>.basnas;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <application>.basnas;

    ssl_certificate     /etc/nginx/certs/basnas/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/basnas/privkey.pem;

    location / {
        proxy_pass http://<application>_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
