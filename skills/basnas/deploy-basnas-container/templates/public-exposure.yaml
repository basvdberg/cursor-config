# /share/.../docker/registry/public-exposure.yaml on BasNAS
# Sync with service-url-map.yaml

domains:
  internal_suffix: basnas
  public_suffix: office.c2h.nl

services:
  admin:
    application: admin
    expose: internal
    url: https://admin.basnas/
    nginx_upstream: https://192.168.2.2:8443
    notes: QNAP QTS via NGINX

  airflow:
    application: airflow
    expose: internal
    url: https://airflow.basnas/
    nginx_upstream: airflow-standalone:8080
    host_port: 8081
    container_port: 8080
    notes: Data-solution / Open-Meteo via DAGs

  immich:
    application: immich
    expose: internal
    url: https://immich.basnas/
    nginx_upstream: immich_server:2283
    host_port: 2283
    container_port: 2283

  plex:
    application: plex
    expose: internal
    url: https://plex.basnas/
    nginx_upstream: plex:32400
    host_port: 32400
    container_port: 32400
    status: planned

  qbittorrent:
    application: qbittorrent
    expose: internal
    url: https://qbittorrent.basnas/
    nginx_upstream: qbittorrent-1:8080
    container_port: 8080

  radarr:
    application: radarr
    expose: internal
    url: https://radarr.basnas/
    nginx_upstream: radarr-3:7878
    container_port: 7878

  nzbget:
    application: nzbget
    expose: internal
    url: https://nzbget.basnas/
    nginx_upstream: nzbget-2:6789
    container_port: 6789

  homebridge:
    application: homebridge
    expose: internal
    url: https://homebridge.basnas/
    nginx_upstream: homebridge-2:8581
