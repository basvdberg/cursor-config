# BasNAS (QNAP) — running services inventory
# Source of truth for agents. Update when adding/removing containers.
# Verified: 2026-06-16 via docker ps on BasNAS

host:
  name: BasNAS
  platform: QNAP QTS / Container Station
  role: Home/office Docker host; data PoC runtime; media stack

edge:
  nginx:
    container_name: nginx-office-c2h
    image: nginx:alpine
    host_ports:
      http: 80
      https: 443
    notes: >
      TLS for office.c2h.nl (LE) and *.basnas (internal CA).
      Vhosts: admin, airflow, immich, radarr, nzbget, homebridge (*.basnas).
      deploy-all-basnas-vhosts.sh (2026-05-29).

dns:
  public_zone: office.c2h.nl
  internal_zone: basnas
  lan_resolver:
    container_name: dns-basnas-lan
    image: strm/dnsmasq
    bind: 192.168.2.2:53
    config: /share/CACHEDEV1_DATA/homes/bas/dns-basnas-container/dnsmasq.conf
    notes: Wildcard *.basnas → 192.168.2.2; Windows NRPT or router DNS to 192.168.2.2

url_map: service-url-map.yaml

docker_networks:
  - name: basnas-internal
    external: true
    notes: Confirm actual network names per stack with docker inspect

services:
  admin-qts:
    application: admin
    kind: platform
    expose: internal
    url_internal: https://admin.basnas/
    notes: QNAP QTS via NGINX (not Docker). Short hostname basnas = QNAP LAN name only.
    status: running

  nginx-office-c2h:
    application: nginx
    container_name: nginx-office-c2h
    image: nginx:alpine
    kind: edge
    expose: edge
    container_ports: [80, 443]
    host_ports: [80, 443]
    url_public: https://<vhost>.office.c2h.nl/
    status: running

  airflow-standalone:
    application: airflow
    container_name: airflow-standalone
    image: apache/airflow:3.2.0
    kind: infrastructure
    expose: internal
    container_port: 8080
    host_port: 8081
    url_internal: https://airflow.basnas/
    notes: Data-solution orchestration (Open-Meteo via DAGs, not separate poller container)

  immich_server:
    application: immich
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    kind: application
    expose: internal
    container_port: 2283
    host_port: 2283
    url_internal: https://immich.basnas/
    stack: immich
    status: running

  basnas_postgress:
    application: immich-postgres
    container_name: basnas_postgress
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    kind: database
    expose: internal
    container_port: 5432
    host_port: 5432
    stack: immich
    notes: Typo in container name (postgress). Do not expose 5432 to WAN.
    status: running

  immich_machine_learning:
    application: immich-ml
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    kind: worker
    expose: internal
    host_ports: []
    stack: immich
    status: running

  immich_redis:
    application: immich-redis
    container_name: immich_redis
    image: valkey/valkey:9
    kind: cache
    expose: internal
    container_port: 6379
    host_ports: []
    stack: immich
    status: running

  qbittorrent-1:
    application: qbittorrent
    container_name: qbittorrent-1
    image: linuxserver/qbittorrent
    kind: media
    expose: internal
    host_ports: [32768, 32769, 32772]
    url_internal: https://qbittorrent.basnas/
    notes: Stopped — host port 32769 conflicts with radarr-3; reassign before start + run deploy-all-basnas-vhosts.sh
    status: stopped

  radarr-3:
    application: radarr
    container_name: radarr-3
    image: lscr.io/linuxserver/radarr:latest
    kind: media
    expose: internal
    container_port: 7878
    host_port: 32769
    url_internal: https://radarr.basnas/
    notes: NGINX upstream via bridge IP 10.0.3.x:7878
    status: running

  nzbget-2:
    application: nzbget
    container_name: nzbget-2
    image: nzbgetcom/nzbget
    kind: media
    expose: internal
    container_port: 6789
    host_port: 32768
    url_internal: https://nzbget.basnas/
    notes: NGINX upstream via bridge IP 10.0.3.x:6789
    status: running

  homebridge-2:
    application: homebridge
    container_name: homebridge-2
    image: homebridge/homebridge
    kind: smarthome
    expose: internal
    container_port: 8581
    url_internal: https://homebridge.basnas/
    notes: qnet-static IP 192.168.2.36:8581
    status: running

  plex:
    application: plex
    container_name: null
    image: null
    kind: media
    expose: internal
    container_port: 32400
    host_port: 32400
    url_internal: https://plex.basnas/
    notes: Add container via docker ps; linuxserver/plex or plexinc/pms-docker
    status: planned

  adguard-home:
    application: adguard-home
    kind: infrastructure
    expose: internal
    notes: Planned LAN DNS for *.basnas
    status: planned

non_docker:
  - name: data-solution-2026
    path: ~/apps/data-solution-2026
    notes: Git clone; CI/CD per data-solution-2026/doc/design/ci-cd.md
